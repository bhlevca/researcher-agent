conversation_task:
  description: >
    You are having a conversation in {target_lang} with a {level}-level student
    whose native language is {native_lang}.

    Conversation context:
    {context}

    Student's message: "{message}"

    Respond naturally in {target_lang}. If the student made grammatical or
    vocabulary errors, correct them kindly — show the mistake and the fix with
    a brief {native_lang} explanation. Introduce 1-3 new vocabulary items when
    appropriate.

    At the end of your response, add a section:
    ### New Vocabulary
    | Word | Translation | Part of Speech | Example | Conjugation |
    |------|-------------|----------------|---------|-------------|
    (list any new words you introduced or that the student should learn;
     for verbs fill in the Conjugation column with present tense forms,
     leave Conjugation empty for non-verbs)

    If the student wrote in {native_lang} and seems to want help translating or
    is asking a question about the language, answer helpfully and then encourage
    them to try expressing the same idea in {target_lang}.
  expected_output: >
    A natural conversational reply in {target_lang} with inline corrections if
    needed, followed by a New Vocabulary markdown table. The response should be
    warm, encouraging, and at the appropriate {level} complexity.
  agent: language_tutor

lesson_task:
  description: >
    Create a structured {lesson_type} lesson plan for a {level}-level student
    learning {target_lang} (native language: {native_lang}).

    Topic: {topic}

    The lesson MUST include:
    1. **Lesson Title** and **Objectives** (what the student will learn)
    2. **Introduction** — brief context and motivation for this topic
    3. **Grammar Explanation** — clear rules with examples (if applicable)
       - Use conjugation tables where relevant
       - Show sentence patterns
    4. **Vocabulary** — a comprehensive table:
       | Word/Phrase | Translation | Part of Speech | Example Sentence |
       |-------------|-------------|----------------|------------------|
       Include at least 15-20 vocabulary items.
    5. **Typical Situations / Dialogues** — 2-3 realistic example dialogues
       using the lesson vocabulary and grammar in context
    6. **Practice Exercises** — at least 5 exercises:
       - Fill-in-the-blank
       - Translation (both directions)
       - Sentence construction
       - Error correction
    7. **Solutions** — answers to all exercises
    8. **Summary** — key takeaways

    Use markdown formatting throughout. Make it thorough and complete.
  expected_output: >
    A complete, well-structured lesson plan in markdown with all 8 sections.
    The vocabulary table must have at least 15 entries. Exercises must have
    solutions provided. Content must match the {level} CEFR band.
  agent: language_tutor

quiz_task:
  description: >
    Generate a quiz for a {level}-level student of {target_lang}
    (native language: {native_lang}).

    ════ STRICT REQUIREMENT — READ FIRST ════
    {quiz_type_instruction}
    ═════════════════════════════════════════

    Number of questions: {num_questions}

    {vocabulary_context}

    {lesson_context}

    Output the quiz as a JSON array wrapped in ```json fences.
    Every question object MUST have these fields:
      "id" (integer, 0-based), "type" (string), "question" (string),
      "options" (array or null), "correct_answer" (string).
    Plus type-specific extra fields:
      matching      → "pairs": [{"left": word, "right": translation}, ...]
      reorder       → "words": [shuffled word list]
      listening     → "audio_text": phrase the student will hear
      pronunciation → "target_sentence": the sentence the student must speak aloud

    Mix difficulty within the {level} CEFR band.
  expected_output: >
    A valid JSON array of {num_questions} question objects inside ```json fences.
    Every question uses only the type(s) stated in the STRICT REQUIREMENT above.
    The JSON must be parseable by json.loads().
  agent: language_tutor

grade_task:
  description: >
    You are grading quiz answers for a {level}-level student learning {target_lang}
    (native language: {native_lang}).

    Evaluate each student answer against the correct answer with linguistic awareness:
    - Accept synonyms, paraphrases, and semantically equivalent answers.
    - Accept minor typos and alternate transliterations.
    - Ignore trailing punctuation differences (e.g. "apple." vs "apple" are equal).
    - Ignore leading/trailing whitespace and capitalisation differences.
    - If the student's answer is an exact match to correct_answer (case-insensitive,
      ignoring trailing punctuation), you MUST give score=1.0.
    - Award partial credit (0.5) for partially correct answers
      (e.g. correct word, wrong gender/tense).
    - Score 0.0 for answers that are clearly wrong or blank.
    - For "translation" type: accept any accurate paraphrase that conveys the same
      meaning. Different word order, synonym choices, and minor structural variations
      should score 0.7–1.0 if the meaning is preserved. Only deduct heavily for
      incorrect meaning or missing key content.
    - For "matching" type: the answer format is "word1=trans1; word2=trans2; ...".
      Award proportional partial credit: (correct pairs) / (total pairs) as the score.
    - For "cloze" type: the correct_answer contains ONLY the missing word, not
      the full sentence. The question field may contain a hint in parentheses —
      ignore the hint when comparing. Award 1.0 if the student's word is the
      correct word OR any other word that is grammatically valid AND semantically
      appropriate in the blank. Only mark wrong (0.0) if the answer is the wrong
      word class or grammatically incorrect for the blank position.
    - For "reorder" type: award 1.0 for the correct sentence, 0.5 if the words are
      mostly correct but in a slightly wrong order, 0.0 if completely wrong.
    - For "listening" type: accept minor diacritic/accent differences (e.g. "cinema"
      vs "cinéma", "ou" vs "où" should score 0.9–1.0, not 0.0). Only mark wrong
      if the student wrote completely different words.

    IMPORTANT: Do NOT include the correct answer in the "feedback" string.
    The UI displays the correct answer separately. Your feedback should only explain
    WHY the answer is right or wrong (e.g. grammar point, what was missing).

    Questions and student answers (JSON):
    {qa_json}

    Return ONLY a valid JSON array wrapped in ```json fences. No other text.
    Each element must have exactly these fields:
    - "question_id": integer (same as in the input)
    - "score": float between 0.0 and 1.0
    - "is_correct": boolean (true if score >= 0.5)
    - "feedback": one short sentence in {native_lang} explaining WHY (not the answer)
  expected_output: >
    A JSON array wrapped in ```json fences. Each element has question_id (int),
    score (float 0.0–1.0), is_correct (bool), and feedback (string in {native_lang}).
    The array length must equal the number of input questions.
    The JSON must be parseable by json.loads().
  agent: language_tutor

scenario_task:
  description: >
    You are "{role_tutor}". You are SPEAKING to a {level}-level learner of {target_lang}.
    EVERY word you say is in {target_lang}. You NEVER use {native_lang} — not one word.

    Scenario: {title}
    Setting: {setting}
    Your role: {role_tutor} | Student's role: {role_student}

    Conversation so far:
    {context}

    Student's latest message: "{message}"

    NOTE: If the student's message is "__start__", this is the opening of the scenario —
    deliver your first in-character line to kick off the roleplay. Do NOT comment on the
    word "__start__"; simply begin the dialog naturally.

    LANGUAGE RULE — NON-NEGOTIABLE: Output ONLY {target_lang}. If you find yourself
    about to write a {native_lang} word, stop and replace it with {target_lang}.

    PEDAGOGY RULES:
    1. Drive the conversation: always end your turn with a question or prompt that
       invites the student to respond (e.g. ask what they want, what they prefer,
       where they are going — anything appropriate to the scenario).
    2. Keep vocabulary and grammar at {level} CEFR complexity.
    3. If the student made a clear error, correct it briefly in italics
       (*Correction: ...* in {target_lang}), then continue without dwelling on it.
    4. If the student is silent or confused, give a gentle in-character prompt
       in {target_lang} to move the dialog forward.

    At the end of your reply add:
    ### New Vocabulary
    | Word | Translation | Part of Speech | Example | Conjugation |
    |------|-------------|----------------|---------|-------------|
    (up to 5 new or difficult words used; fill Conjugation for verbs)
  expected_output: >
    An in-character reply entirely in {target_lang} as {role_tutor}, ending with
    a question or prompt for the student. Optionally one italicised correction.
    Followed by the New Vocabulary table.
  agent: language_tutor

appraisal_task:
  description: >
    Evaluate the progress of a {level}-level student learning {target_lang}
    (native language: {native_lang}).

    Student statistics (current session AND cross-session totals):
    {stats}

    The statistics include a "cross_session" section with data aggregated
    across ALL the student's {target_lang} sessions — use this to assess
    long-term progress, consistency, and overall trajectory.

    Recent conversation excerpts (current session):
    {recent_messages}

    Provide a comprehensive appraisal including:
    1. **Overall Assessment** — current estimated CEFR sub-level and trajectory
    2. **Strengths** — what the student does well
    3. **Areas for Improvement** — specific weaknesses to address
    4. **Vocabulary Progress** — analysis of word mastery and retention across sessions
    5. **Grammar Analysis** — common error patterns observed
    6. **Quiz Performance** — trends and problem areas across all sessions
    7. **Session History** — comment on study consistency and frequency
    8. **Recommendations** — specific topics, exercises, or focus areas for next lessons
    9. **Encouragement** — positive, motivating closing remarks

    Be specific and actionable. Reference actual data from the statistics.
  expected_output: >
    A detailed, structured appraisal in markdown with all 9 sections.
    Must reference concrete numbers from both current and cross-session
    statistics and provide specific, actionable recommendations.
  agent: language_tutor

passage_task:
  description: >
    Write a short READING PASSAGE in {target_lang} for a {level}-level learner
    (native language: {native_lang}).

    Topic: {topic}

    THIS IS COMPREHENSIBLE INPUT, NOT A LESSON. The learner should be able to
    read it and understand almost all of it without stopping. Do NOT produce
    grammar tables, exercises or explanations — write connected prose the
    learner enjoys reading.

    LENGTH: about {word_count} words.

    LEVEL DISCIPLINE — this is the most important rule:
    Write so that roughly 90% of the words are ones a {level} learner already
    knows. Only about one word in ten should be new. If you are unsure whether a
    word is above {level}, use a simpler one. Short sentences at A1/A2, longer
    and subordinate clauses only at B1 and above.

    WORDS TO WEAVE IN NATURALLY:
    {due_words}
    These are words the learner is due to review. Use each at least once, in a
    natural context that makes its meaning inferable from the surrounding
    sentence. Do NOT list them, define them, or draw attention to them — the
    point is to meet them again in context.

    OUTPUT FORMAT — exactly these sections, in {target_lang} unless stated:

    ## <title in {target_lang}>

    <the passage itself, flowing prose, no bullet points>

    ### Glossary
    | Word | {native_lang} |
    |------|---------------|
    <only the genuinely new or difficult words, 5-10 rows maximum>

    ### Questions
    1. <comprehension question in {target_lang}>
    2. <comprehension question in {target_lang}>
    3. <comprehension question in {target_lang}>
  expected_output: >
    A reading passage of roughly {word_count} words in {target_lang} at {level}
    level, containing every word from the review list used naturally in context,
    followed by a short glossary and exactly 3 comprehension questions.
    No grammar drills, no exercises, no explanations.
  agent: language_tutor
