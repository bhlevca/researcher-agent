compose_chat_task:
  description: >
    You are collaborating with a musician/composer.
    Project defaults: {genre} style, {key_signature}, {time_signature} at {tempo} BPM.

    Conversation context:
    {context}

    User's message: "{message}"

    Respond helpfully. If the user asks about music theory, explain clearly.
    If they ask you to compose, produce a JSON score.

    GENRE RULE: Use {genre} style UNLESS the user explicitly requests a
    different style in their message (e.g. "bossa nova", "jazz").
    Pass the correct style to CompositionPrep.

    MANDATORY TOOL WORKFLOW for composing:
    Step 1: Call CompositionPrep ONCE (pass the correct style).
    Step 2: STOP calling tools. Write "Final Answer:" with the complete JSON score.
    Do NOT call any tool more than once.
    Compose 16 measures unless the user specifies otherwise.

    COMPOSITION APPROACH: Follow the BAR-BY-BAR ROADMAP from the tool output.
    Create a MOTIF in bars 1-2, then develop it using the techniques provided.
    Imitate the EXAMPLE BARS for genre-authentic rhythm and voicing.
  expected_output: >
    A helpful response about music composition. If notation was requested,
    include a JSON score object. NEVER output XML.
  agent: music_composer

compose_score_task:
  description: >
    Compose a musical score based on this description:

    "{description}"

    Parameters:
    - Genre/Style: {genre} {style}
    - Key: {key_signature}
    - Time signature: {time_signature}
    - Tempo: {tempo} BPM
    - Instruments: {instruments}
    - Length: {measures} measures

    MANDATORY TOOL WORKFLOW:
    Step 1: Call CompositionPrep ONCE (use the genre/style above).
    Step 2: STOP calling tools. Write "Final Answer:" with the complete
    JSON score filled with {measures} measures of composed music.
    Do NOT call any tool more than once.

    Output the JSON score. Write ALL {measures} measures.
    Follow the BAR-BY-BAR ROADMAP from the tool output.
    Create a MOTIF in bars 1-2, then develop it using the techniques provided.
    Imitate the EXAMPLE BARS for genre-authentic rhythm and voicing.
    Before the JSON, briefly describe the composition's form and harmonic approach.
  expected_output: >
    A brief compositional description in markdown followed by a complete
    JSON score object with {measures} measures for each instrument.
    NEVER output XML.
  agent: music_composer

harmonize_task:
  description: >
    Harmonize the following melody:

    {melody}

    Style: {style}
    Key: {key_signature}
    Time signature: {time_signature}

    Provide:
    1. **Chord Analysis** — Roman numeral analysis of your harmonization
    2. **Chord Symbols** — Standard chord symbols above the staff
    3. **Voice Leading** — Explain your voice-leading decisions
    4. **Full Score** — Complete JSON score object with the melody and
       harmony parts as a JSON score object
    5. **Alternative Harmonizations** — Suggest 2-3 reharmonization options

    Output the score as JSON, NEVER as XML.
  expected_output: >
    A detailed harmonization analysis in markdown with chord analysis,
    voice-leading explanations, and a complete JSON score object.
    Include alternative harmonization suggestions. NEVER output XML.
  agent: music_composer

analyze_task:
  description: >
    Analyze the following musical content:

    {content}

    Provide a comprehensive musical analysis including:
    1. **Form Analysis** — Overall structure (e.g., ABA, sonata, 12-bar blues)
    2. **Harmonic Analysis** — Roman numeral analysis, key areas, modulations
    3. **Melodic Analysis** — Motifs, sequences, contour, range
    4. **Rhythmic Analysis** — Patterns, syncopation, meter
    5. **Texture & Voicing** — Part writing, doublings, spacing
    6. **Style & Context** — Genre characteristics, influences
    7. **Strengths** — What works well in this passage
    8. **Suggestions** — Concrete improvements or variations to consider

    If the input includes MusicXML, parse and analyze the actual notation.
    Use markdown tables for chord progressions and form diagrams.
  expected_output: >
    A detailed, structured musical analysis in markdown with all 8 sections.
    Include specific measure references and musical examples where helpful.
    Be precise with music theory terminology.
  agent: music_composer

compose_abc_task:
  description: >
    Compose {measures} bars of {genre} music in ABC notation.

    Request: {description}

    SETTINGS FROM THE INTERFACE — these are not suggestions:
      Key: {key_signature}     Time: {time_signature}     Tempo: {tempo} BPM
      Style: {style}

    ===== HOW THIS STYLE WORKS =====
    {style_guide}

    ===== COMPOSE, DO NOT GENERATE =====
    Random notes that fit the key are not music. Follow this method:

    1. MOTIF. Invent a 2-bar melodic idea with a clear rhythmic shape and a
       memorable contour. Everything else grows from it.
    2. DEVELOP it — do NOT invent unrelated new material every bar. Use:
         - sequence      (the same shape starting a step higher or lower)
         - inversion     (the same shape with the intervals turned upside down)
         - fragmentation (take just the first half and repeat it)
         - augmentation  (the same shape in longer note values)
    3. PHRASE. Build 4-bar phrases that answer each other: an antecedent that
       rises and stays open, a consequent that falls and closes.
    4. SHAPE. Place ONE clear high point about two thirds of the way through,
       and approach it stepwise rather than leaping to it.
    5. CADENCE. End phrases on chord tones. Finish the piece on the tonic.

    ===== BAR LENGTH — GET THIS RIGHT =====
    With L:1/8, every eighth note is one unit. A {time_signature} bar holds
    exactly {units_per_bar} units. Count them in every single bar before moving on.
      - a plain note (A) = 1 unit
      - A2 = 2 units, A3 = 3 units, A4 = 4 units
      - a broken pair A>B = 2 units TOTAL (not 2 each)
    A bar that is short will not play correctly. This is the single most common
    mistake — count, do not estimate.

    ===== DO NOT WRITE SCALES =====
    Running straight up or down the scale is not a melody. Never write more than
    five notes moving in the same direction without turning around. Each phrase
    needs at least one leap of a third or more, and the leap should be answered
    by stepwise motion the other way.

    ===== RULES THAT KEEP IT LISTENABLE =====
    - Mostly stepwise motion, but NOT exclusively — see above.
    - After any leap larger than a fourth, move back by step in the opposite
      direction.
    - Stay inside a single octave and a half unless the style says otherwise.
    - Repeat material deliberately: a listener needs to hear an idea more than
      once to recognise it. Aim for at least half the bars to be a recognisable
      variant of the motif.
    - Vary note lengths. A stream of identical durations is an exercise, not a
      melody.
    - Put chord symbols in "quotes" above the melody where the style uses them.

    ===== OUTPUT FORMAT =====
    Output ONLY ABC notation inside a single ```abc code block. Nothing else —
    no explanation before or after.

    The header must be exactly:
    X:1
    T:<a short title>
    M:{time_signature}
    L:1/8
    Q:1/4={tempo}
    K:{key_signature_abc}

    Then the music, using | for barlines and |: :| for repeated sections.
    Write exactly {measures} bars.
  expected_output: >
    A single ```abc block containing valid ABC notation: the required header
    followed by exactly {measures} bars in {key_signature}, {time_signature}.
    The music must develop a single recognisable motif rather than presenting
    unrelated material each bar. No prose outside the code block.
  agent: music_composer

fix_abc_task:
  description: >
    Your previous attempt has specific, measured faults. Fix them.

    ===== WHAT YOU WROTE =====
    {previous_abc}

    ===== WHAT IS WRONG =====
    {issues}

    ===== HOW TO FIX EACH FAULT =====
    SHORT BARS: with L:1/8 a {time_signature} bar must contain exactly
    {units_per_bar} units. Count every bar. A plain note is 1 unit, A2 is 2,
    A3 is 3, A4 is 4, and a broken pair A>B is 2 units TOTAL for the pair.
    Add or lengthen notes so each bar reaches exactly {units_per_bar}.

    LONG SCALE RUNS: you wrote a long line of notes all moving the same way.
    Break it. After at most four notes in one direction, turn around or leap.
    Replace part of the run with a repetition of your motif, or with a leap of
    a third/fourth answered by stepwise motion the other way.

    TOO MUCH STEPWISE MOTION: add leaps. Each phrase needs at least one leap of
    a third or more.

    ===== KEEP WHAT WORKS =====
    Do NOT start from scratch. Keep the key, metre, title, the motif and the
    overall shape. Change only what is needed to clear the faults listed above.

    Output ONLY the corrected ABC inside a single ```abc block. No commentary.
  expected_output: >
    A single ```abc block containing the corrected tune: same key, metre and
    musical material as before, with every listed fault fixed and every bar
    exactly {units_per_bar} units long.
  agent: music_composer
