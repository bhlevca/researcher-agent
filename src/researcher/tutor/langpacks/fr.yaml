# French language pack — the data deterministic exercises are built from.
#
# Every answer printed on a French grammar sheet comes from this file, so the
# answer key is correct by construction rather than by a model's confidence.
# That is the whole point: a child who is marked wrong on a correct answer, or
# right on a wrong one, learns something false and is then told it twice.
#
# Add entries freely — generators read whatever is here. Each entry carries the
# CEFR level at which it is reasonable to ask, so an A1 sheet never reaches for
# the subjunctive.

meta:
  name: French
  code: fr
  # Elision before a vowel or MUTE h is the rule that catches everyone out.
  elides_before_vowel: true
  vowels: "aeiouâàéèêëîïôûùüœh"
  # Aspirate h blocks elision: "le haricot", never "l'haricot". Every h-word
  # currently in the pack is mute (homme, histoire, hôpital), so this is empty
  # — but a word added later needs listing here or it will be set wrongly.
  aspirate_h: []

articles:
  definite: {m: "le", f: "la", pl: "les", elided: "l'"}
  indefinite: {m: "un", f: "une", pl: "des"}
  partitive: {m: "du", f: "de la", pl: "des", elided: "de l'"}

pronouns: ["je", "tu", "il", "nous", "vous", "ils"]

# Pronoun forms that elide: je -> j' before a vowel.
pronoun_elision: {je: "j'"}

