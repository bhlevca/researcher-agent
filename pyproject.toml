[project]
name = "researcher-agent"
version = "2.4.0"
dependencies = [
    "crewai[tools]>=1.14.5",
    "litellm",
    "ollama",
    "ddgs",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "langchain-community",
    "httpx",
    "Pillow",
    "spandrel",
    "opencv-python",
    "diffusers",
    "transformers",
    "accelerate",
    "safetensors",
    "aiosqlite",
    # faster-whisper (CTranslate2) replaces openai-whisper: no numba/triton in the
    # dependency chain, so it cannot be broken by a NumPy major bump, and it is
    # ~4x faster on CPU at the same model size.
    "faster-whisper",
    "edge-tts",
    "langdetect",
    "bcrypt",
    "PyJWT",
    "pymupdf",
    "python-docx",
    "openpyxl",
    # Imported directly by src/ — declared explicitly so they are never dropped
    # as incidental transitive dependencies of another package.
    "numpy",
    "requests",
    "PyYAML",
    "json-repair",
    "huggingface-hub",
    "pytest",
    "pytest-asyncio",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires running server (use --integration to run)",
]