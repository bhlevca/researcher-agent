# Sentence frames for question text, in English, French and Romanian.
#
# WHOLE SENTENCES, not words. Gluing translated words together produces
# "Trouver le aire de ce cercle" — visibly machine-made, and not something you
# hand a child. A frame may put its placeholders in a different order from the
# English, which is the point.
#
# Placeholders are {name} and are filled with LaTeX. Templates must contain NO
# literal { } braces of their own: every piece of mathematics arrives as a
# parameter. (A literal brace would be read as a placeholder.)
#
# Mathematical register matters and differs from everyday translation:
#   gradient            -> fr "coefficient directeur"   ro "panta"
#   perpendicular bisector -> fr "médiatrice"           ro "mediatoarea"
#   common difference/ratio -> fr "raison"              ro "rația"
#   cyclic quadrilateral -> fr "quadrilatère inscriptible"  ro "patrulater inscriptibil"
#   cuboid              -> fr "pavé droit"              ro "paralelipiped dreptunghic"
#   slant height        -> fr "génératrice"             ro "generatoarea"
#   curved surface area -> fr "aire latérale"           ro "aria laterală"
#
# French convention: a space before : ; ! ? and inside « ».
# French and Romanian both write decimals with a comma; i18n.fmt_num does that.
#
# Corrections are welcome — this file is data, and nothing here is generated at
# run time, so what you write is exactly what gets printed.

