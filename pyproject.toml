[project]
name = "researcher-agent"
version = "2.13.0"
dependencies = [
    "crewai[tools]>=1.14.5",
    "litellm",
    "ollama",
    "ddgs",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "langchain-community",
    "httpx",
    "Pillow",
    "spandrel",
    "opencv-python",
    "diffusers",
    "transformers",
    "accelerate",
    "safetensors",
    "aiosqlite",
    # faster-whisper (CTranslate2) replaces openai-whisper: no numba/triton in the
    # dependency chain, so it cannot be broken by a NumPy major bump, and it is
    # ~4x faster on CPU at the same model size.
    "faster-whisper",
    "edge-tts",
    "langdetect",
    "bcrypt",
    "PyJWT",
    "pymupdf",
    "python-docx",
    "odfpy",
    # T5-family tokenizers (LTX-Video, Wan) ship a SentencePiece spiece.model.
    # Without this, transformers 5.x misroutes it through the tiktoken loader
    # and dies with "Error parsing line b'\\x0e'".
    "sentencepiece",
    # Wan's image-to-video pipeline (used for clip chaining) calls ftfy for
    # prompt cleaning. diffusers imports it lazily, so its absence surfaces as
    # a bare NameError deep inside encode_prompt rather than an ImportError.
    "ftfy",
    # music21 parses ABC notation and converts it to MusicXML. ABC is far more
    # compatible with LLMs than note-by-note JSON (~38% of the tokens, and it
    # encodes repeats and structure intrinsically), so it is the composer's
    # interchange format.
    "music21",
    # Phoneme-level pronunciation scoring. epitran maps graphemes to IPA and
    # panphon measures ARTICULATORY FEATURE distance between IPA segments, so
    # a near-miss (/\u0281/ for /\u027e/) scores differently from a wrong word. Word-level
    # WER cannot: it scores recognition, so an accent Whisper still decodes
    # scores a perfect 1.0. Neither package needs espeak or any system binary.
    "epitran",
    "panphon",
    # Video export: imageio-ffmpeg writes H.264 MP4 that browsers can play.
    # OpenCV's VideoWriter defaults to mp4v, which most browsers refuse.
    "imageio",
    "imageio-ffmpeg",
    # FSRS (Free Spaced Repetition Scheduler) — the ML-fitted successor to SM-2.
    "fsrs",
    "openpyxl",
    # Imported directly by src/ — declared explicitly so they are never dropped
    # as incidental transitive dependencies of another package.
    "numpy",
    "requests",
    "PyYAML",
    "json-repair",
    "huggingface-hub",
    "pytest",
    "pytest-asyncio",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires running server (use --integration to run)",
]